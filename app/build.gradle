plugins { id 'com.android.application' }

android {
    namespace 'com.fable.control'
    compileSdk 34

    defaultConfig {
        applicationId 'com.fable.control'
        minSdk 28
        targetSdk 28
        versionCode 12
        versionName '2.1'
    }

    signingConfigs {
        release {
            storeFile file('fable.keystore')
            storePassword 'fablecontrol'
            keyAlias 'fable'
            keyPassword 'fablecontrol'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

