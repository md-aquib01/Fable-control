plugins { id 'com.android.application' }

android {
    namespace 'com.fable.notes'
    compileSdk 34

    defaultConfig {
        applicationId 'com.fable.notes'
        minSdk 31
        targetSdk 34
        versionCode 5
        versionName '2.0.1'
    }

    signingConfigs {
        release {
            storeFile file('fable.keystore')
            storePassword 'fablecontrol'
            keyAlias 'fable'
            keyPassword 'fablecontrol'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            signingConfig signingConfigs.release
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
